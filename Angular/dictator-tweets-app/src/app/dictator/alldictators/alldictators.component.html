<div id="all_dictators_container"  >
    <mat-card class="dictator_card" *ngFor="let _dictator of dictators" >
        <!-- <mat-card-subtitle>{{_dictator.birthYear}} - {{_dictator.deadYear}}</mat-card-subtitle> -->
        <mat-card-title class="dictator_card_title">
            <a [routerLink]="['/dictator',_dictator.id]">{{_dictator.firstName}} {{_dictator.lastName}}</a>
        </mat-card-title>
        <!-- <app-tweet [tweet]="tweetsHandler.getLatestTweetForDictator(_dictator.mappningText) | async"></app-tweet> -->
        <mat-card-content *ngIf="(tweetsHandler.getLatestTweetForDictator(_dictator.mappningText) | async) as tweet" class="dictator_card_content">
            <div *ngIf="(tweet | json)!= '{}'" [innerHTML]="tweet.Tweet">
            </div>
        </mat-card-content>
    </mat-card>
    
</div>
