<div *ngFor="let _dictator of dictators">
    <mat-card>
        <mat-card-subtitle>{{_dictator.birthYear}} - {{_dictator.deadYear}}</mat-card-subtitle>
        <mat-card-title>
            <a [routerLink]="['/dictator',_dictator.id]">{{_dictator.firstName}} {{_dictator.lastName}}</a>
        </mat-card-title>
        <mat-card-content *ngIf="_dictator.tweet$ | async as tweet">
            <div *ngIf="(tweet | json)!= '{}'">

                Tweet: {{tweet.Tweet}}
            </div>
        </mat-card-content>
    </mat-card>
    <div *ngFor="let tweet of _dictator.tweets$ |async">
        AllTweet: {{tweet.Tweet}}
    </div>

</div>
<button (click)="onTestClick()">Test</button>
